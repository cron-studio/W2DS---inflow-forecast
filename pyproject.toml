[project]
name = "afluencia-indevida-pipeline"
version = "0.1.0"
description = "Pipeline de cálculo de afluências indevidas a partir dos caudalímetros NIVUS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "requests>=2.32",
    "plotly>=6.5",
    "scikit-learn>=1.5",
    "timestral",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }
